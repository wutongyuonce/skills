name: release

on:
  push:
    tags: ['V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach kami.zip to (e.g. V1.4.1)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  attach-archive:
    name: build kami.zip and attach to release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve tag name
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^V[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag must match Vx.y.z"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Verify release identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          runs="$(gh run list --workflow=check.yml --commit "$SHA" --limit 20 \
            --json headSha,headBranch,event,status,conclusion)"
          printf '%s\n' "$runs" > /tmp/kami-check-runs.json
          python3 scripts/release_gate.py \
            --tag "$TAG" \
            --main-ref origin/main \
            --checks-json /tmp/kami-check-runs.json
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "OK: exact release SHA passed check.yml on main push"

      - name: Build and compare kami.zip
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          bash scripts/package-skill.sh /tmp/kami.zip
          python3 scripts/release_gate.py \
            --tag "$TAG" \
            --tracked-archive dist/kami.zip \
            --candidate-archive /tmp/kami.zip
          ls -lah /tmp/kami.zip

      - name: Ensure release exists, then attach archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          git fetch --no-tags --force origin \
            "refs/tags/$TAG:refs/tags/kami-release-remote"
          REMOTE_SHA="$(git rev-parse --verify \
            "refs/tags/kami-release-remote^{commit}")"
          if [[ "$REMOTE_SHA" != "$EXPECTED_SHA" ]]; then
            echo "ERROR: remote tag moved from $EXPECTED_SHA to $REMOTE_SHA"
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist, creating placeholder"
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Release notes pending. Edit on GitHub."
          fi
          asset_count="$(gh release view "$TAG" --json assets \
            --jq '[.assets[] | select(.name == "kami.zip")] | length')"
          if [[ "$asset_count" == "0" ]]; then
            gh release upload "$TAG" /tmp/kami.zip
            echo "OK: kami.zip attached to release $TAG"
          elif [[ "$asset_count" == "1" ]]; then
            mkdir -p /tmp/kami-published
            gh release download "$TAG" --pattern kami.zip --dir /tmp/kami-published
            python3 scripts/release_gate.py \
              --tag "$TAG" \
              --tracked-archive /tmp/kami.zip \
              --candidate-archive /tmp/kami-published/kami.zip
            echo "OK: existing kami.zip already matches this release"
          else
            echo "ERROR: release $TAG has $asset_count kami.zip assets"
            exit 1
          fi

      - name: Add and verify release reactions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Match the house style every release carries: one of each positive
          # reaction. Duplicate POSTs are harmless on a rerun; the final GET is
          # the completion proof and fails if any reaction is still absent.
          rid="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)"
          for r in +1 eyes heart hooray laugh rocket; do
            gh api -X POST "repos/${{ github.repository }}/releases/$rid/reactions" \
              -f content="$r" --jq .content || echo "skip reaction $r"
          done
          actual="$(gh api --paginate \
            "repos/${{ github.repository }}/releases/$rid/reactions" \
            --jq '.[].content')"
          missing=()
          for r in +1 eyes heart hooray laugh rocket; do
            if ! grep -Fxq "$r" <<<"$actual"; then
              missing+=("$r")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "ERROR: release reactions missing: ${missing[*]}"
            exit 1
          fi
          echo "OK: reactions ensured on release $TAG"
